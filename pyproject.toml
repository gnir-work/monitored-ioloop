[project]
name = "monitored_ioloop"
version = "0.0.23"
description = ""
authors = [{ name = "gnir", email = "gnir.work@gmail.com" }]
requires-python = ">=3.8"
readme = "README.md"
dependencies = [
    "wrapt>=1.17.2,<2",
    "typing_extensions>=4.0.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
uvloop = [
    "uvloop>=0.17.0,<0.22 ; python_version < '3.14'",
    "uvloop>=0.22 ; python_version >= '3.14'",
]
fastapi = ["fastapi>=0.115.7"]

[dependency-groups]
dev = [
    "ipython>=7.0.0",
    "requests>=2.31.0,<3",
    "ipdb>=0.13.13",
]
code_quality = [
    "mypy>=1.10.1,<2",
    "ruff>=0.5.1,<0.6",
    "pytest>=8.0.1,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-xdist>=3.5.0,<4",
    "pytest-repeat>=0.9.3,<0.10",
    "httpx>=0.27.0,<0.28",
]
stress_test = [
    "fastapi>=0.115.7 ; python_version >= '3.9'",
    "uvicorn>=0.38.0 ; python_version >= '3.9'",
    "click>=8.1.7,<9 ; python_version >= '3.9'",
    "locust>=2.23.1,<3 ; python_version >= '3.9'",
]
examples = [
    "fastapi>=0.115.7 ; python_version >= '3.9'",
    "prometheus-client>=0.20.0,<0.21 ; python_version >= '3.9'",
    "httpx>=0.27.0,<0.28 ; python_version >= '3.9'",
    "uvicorn>=0.38.0 ; python_version >= '3.9'",
    "uvloop>=0.21.0 ; python_version >= '3.9'",
]

[tool.uv]
default-groups = [
    "dev",
    "code_quality",
    "stress_test",
    "examples",
]

[tool.hatch.build.targets.sdist]
include = [
    "monitored_ioloop",
    "monitored_ioloop/py.typed",
]

[tool.hatch.build.targets.wheel]
include = [
    "monitored_ioloop",
    "monitored_ioloop/py.typed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
